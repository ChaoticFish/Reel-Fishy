PLG_SYSTEM_REELFISHY="System - Reel Fishy"
PLG_SYSTEM_REELFISHY_XML_DESCRIPTION="A self-contained, sparkly video player. Add a player with <code>{reelfishy src=&quot;images/videos/clip.mp4&quot;}</code> in an article or a Custom module with Prepare Content on."

PLG_SYSTEM_REELFISHY_SPARKLES_LABEL="Sparkles"
PLG_SYSTEM_REELFISHY_SPARKLES_DESC="Particle bursts on play and pause, and a shimmering progress bar. Always off for visitors who ask their device for reduced motion."
PLG_SYSTEM_REELFISHY_ICONS_LABEL="Icon set"
PLG_SYSTEM_REELFISHY_ICONS_DESC="The look of the player buttons."
PLG_SYSTEM_REELFISHY_ICONS_FISHY="Fishy (wrasse)"
PLG_SYSTEM_REELFISHY_ICONS_CLASSIC="Classic"
PLG_SYSTEM_REELFISHY_ICONS_MINIMAL="Minimal"
PLG_SYSTEM_REELFISHY_LOADER_LABEL="Loading screen"
PLG_SYSTEM_REELFISHY_LOADER_DESC="Shown when a video takes a moment to load or buffer. Automatic uses the fish with the Fishy icon set and a plain ring with the others."
PLG_SYSTEM_REELFISHY_LOADER_AUTO="Automatic"
PLG_SYSTEM_REELFISHY_LOADER_FISH="Swimming fish"
PLG_SYSTEM_REELFISHY_LOADER_RING="Plain ring"
PLG_SYSTEM_REELFISHY_PLAY_IMAGE_LABEL="Play button image"
PLG_SYSTEM_REELFISHY_PLAY_IMAGE_DESC="A PNG or SVG to use on the big play button instead of the wrasse. Leave empty for the wrasse. Square images look best. Other image types are ignored, and if the image can't load, the wrasse comes back."
PLG_SYSTEM_REELFISHY_LOADER_IMAGE_LABEL="Loading screen image"
PLG_SYSTEM_REELFISHY_LOADER_IMAGE_DESC="A PNG or SVG that swims around the loading screen instead of the wrasse. Leave empty for the wrasse. Setting this turns on the swimming loader even with the Classic or Minimal icons. To pick SVGs here, add svg to the Media options' allowed and image extensions."
PLG_SYSTEM_REELFISHY_LOOP_LABEL="Loop videos"
PLG_SYSTEM_REELFISHY_LOOP_DESC="Start each video again when it ends. A video with an end time repeats just that clip."
PLG_SYSTEM_REELFISHY_LAZY_LABEL="Load videos"
PLG_SYSTEM_REELFISHY_LAZY_DESC="On click shows only the poster until the visitor presses play, so pages with several videos load faster. Use a poster image with it."
PLG_SYSTEM_REELFISHY_LAZY_OFF="With the page"
PLG_SYSTEM_REELFISHY_LAZY_CLICK="On click"
PLG_SYSTEM_REELFISHY_RESUME_LABEL="Resume where left off"
PLG_SYSTEM_REELFISHY_RESUME_DESC="Remembers each visitor's place in a video, in their own browser."
PLG_SYSTEM_REELFISHY_CAPTIONS_ON_LABEL="Captions on by default"
PLG_SYSTEM_REELFISHY_CAPTIONS_ON_DESC="Shows captions as soon as a video with a captions file loads."
PLG_SYSTEM_REELFISHY_SPEEDS_LABEL="Playback speeds"
PLG_SYSTEM_REELFISHY_SPEEDS_DESC="Comma-separated speeds for the speed button and picker, e.g. 0.5,1,1.5,2. 1 is always included."

PLG_SYSTEM_REELFISHY_FIELDSET_TRANSCRIPT="Transcript"
PLG_SYSTEM_REELFISHY_TRANSCRIPT_OPEN_LABEL="Transcript open by default"
PLG_SYSTEM_REELFISHY_TRANSCRIPT_OPEN_DESC="Opens the searchable transcript panel when a video has a captions or transcript file."
PLG_SYSTEM_REELFISHY_SEARCH_OFFSET_LABEL="Search lead-in (seconds)"
PLG_SYSTEM_REELFISHY_SEARCH_OFFSET_DESC="Jumping to a search match starts this many seconds early, so the visitor hears the lead-in."

PLG_SYSTEM_REELFISHY_GLOW_LABEL="Ambient glow"
PLG_SYSTEM_REELFISHY_GLOW_DESC="While a video plays, a soft glow around the player picks up the video's colours. YouTube, Vimeo and TikTok, and videos from another site that doesn't allow it, glow in your accent colour instead."
PLG_SYSTEM_REELFISHY_CONFETTI_LABEL="Confetti at the end"
PLG_SYSTEM_REELFISHY_CONFETTI_DESC="A shower of confetti in your accent colours when a video finishes. Not shown over YouTube, Vimeo or TikTok players."
PLG_SYSTEM_REELFISHY_THEATER_LABEL="Theater mode button"
PLG_SYSTEM_REELFISHY_THEATER_DESC="A button (and the W key) that dims the page and enlarges the player in the middle of the screen. Esc or a click outside closes it."
PLG_SYSTEM_REELFISHY_PREVIEWS_LABEL="Live seek previews"
PLG_SYSTEM_REELFISHY_PREVIEWS_DESC="Hovering the seek bar with a mouse shows a picture of that moment, taken from the video file itself. It downloads extra parts of the video while hovering. A tag's thumbnails file is used instead when given, and is the only option for YouTube, Vimeo and TikTok."
PLG_SYSTEM_REELFISHY_HOVER_PREVIEW_LABEL="Hover preview"
PLG_SYSTEM_REELFISHY_HOVER_PREVIEW_DESC="Before a video is played, resting a mouse on it plays a silent 6-second preview over the poster. Video files only, not YouTube, Vimeo or TikTok. It downloads part of the video while the mouse is there. Skipped for visitors who ask their device for less motion or to save data, and for videos set to Load on click."
PLG_SYSTEM_REELFISHY_FRAME_TOOLS_LABEL="Frame tools"
PLG_SYSTEM_REELFISHY_FRAME_TOOLS_DESC="Adds Grab a frame to the Share panel: step back or forward one frame (also the , and . keys) and save the frame as a PNG picture. Video files only. A video hosted on another site can only be saved if that site allows it."

PLG_SYSTEM_REELFISHY_FIELDSET_CAPTIONS="Captions and descriptions"
PLG_SYSTEM_REELFISHY_CAPTION_SIZE_LABEL="Caption size"
PLG_SYSTEM_REELFISHY_CAPTION_SIZE_DESC="Starting size of captions. Visitors can change it from the captions menu (hold the CC button), and their choice is remembered."
PLG_SYSTEM_REELFISHY_CAPTION_SIZE_S="Small"
PLG_SYSTEM_REELFISHY_CAPTION_SIZE_M="Medium"
PLG_SYSTEM_REELFISHY_CAPTION_SIZE_L="Large"
PLG_SYSTEM_REELFISHY_CAPTION_SIZE_XL="Extra large"
PLG_SYSTEM_REELFISHY_CAPTION_BG_LABEL="Caption background"
PLG_SYSTEM_REELFISHY_CAPTION_BG_DESC="Starting background behind captions. Visitors can change it from the captions menu."
PLG_SYSTEM_REELFISHY_CAPTION_BG_SOLID="Solid"
PLG_SYSTEM_REELFISHY_CAPTION_BG_CLEAR="See-through"
PLG_SYSTEM_REELFISHY_CAPTION_BG_NONE="None (text outline)"
PLG_SYSTEM_REELFISHY_DESCRIPTIONS_ON_LABEL="Audio description on"
PLG_SYSTEM_REELFISHY_DESCRIPTIONS_ON_DESC="Starts audio description automatically for videos that have a descriptions file. Visitors can turn it off with the AD button, and their choice is remembered."

PLG_SYSTEM_REELFISHY_FIELDSET_ENDSCREEN="End screen"
PLG_SYSTEM_REELFISHY_END_NOTE="When a video finishes, show a message and up to two buttons, plus Replay. Leave everything empty for no end screen. A tag can override any of these, or turn it off with end-screen=&quot;off&quot;."
PLG_SYSTEM_REELFISHY_END_MESSAGE_LABEL="Message"
PLG_SYSTEM_REELFISHY_END_MESSAGE_HINT="Help us feed the herd"
PLG_SYSTEM_REELFISHY_END_BUTTON_1_LABEL="Button 1 text"
PLG_SYSTEM_REELFISHY_END_BUTTON_1_HINT="Donate"
PLG_SYSTEM_REELFISHY_END_URL_1_LABEL="Button 1 link"
PLG_SYSTEM_REELFISHY_END_BUTTON_2_LABEL="Button 2 text"
PLG_SYSTEM_REELFISHY_END_URL_2_LABEL="Button 2 link"
PLG_SYSTEM_REELFISHY_END_URL_HINT="/donate, https://…, mailto:hello@example.com or tel:+13045550100"
PLG_SYSTEM_REELFISHY_END_LEAD_LABEL="Show before the end (seconds)"
PLG_SYSTEM_REELFISHY_END_LEAD_DESC="The end screen fades in this many seconds before the video finishes, while the last moments keep playing. 0 shows it only once the video has ended."

PLG_SYSTEM_REELFISHY_FIELDSET_FLOATING="Mini player"
PLG_SYSTEM_REELFISHY_MINI_LABEL="Dock while scrolling"
PLG_SYSTEM_REELFISHY_MINI_DESC="When a playing video scrolls out of view, it docks to a corner and keeps playing."
PLG_SYSTEM_REELFISHY_DOCK_LABEL="Dock position"
PLG_SYSTEM_REELFISHY_DOCK_RIGHT="Bottom right"
PLG_SYSTEM_REELFISHY_DOCK_LEFT="Bottom left"
PLG_SYSTEM_REELFISHY_CARRY_LABEL="Carry-over between pages"
PLG_SYSTEM_REELFISHY_CARRY_DESC="If a video is playing when the visitor moves to another page, it reopens there as a mini player and waits for one tap. This loads the player script on every page."
PLG_SYSTEM_REELFISHY_CARRY_MINUTES_LABEL="Carry-over expires after (minutes)"
PLG_SYSTEM_REELFISHY_CARRY_MINUTES_DESC="A carried video is forgotten after this long."
PLG_SYSTEM_REELFISHY_PIP_LABEL="Picture-in-picture button"
PLG_SYSTEM_REELFISHY_PIP_DESC="Shows the browser's picture-in-picture button where supported (Chrome, Edge, Safari)."

PLG_SYSTEM_REELFISHY_FIELDSET_EMBEDS="YouTube, Vimeo, TikTok"
PLG_SYSTEM_REELFISHY_ALLOW_YOUTUBE_LABEL="Allow YouTube videos"
PLG_SYSTEM_REELFISHY_ALLOW_YOUTUBE_DESC="Lets a tag's src be a YouTube link. YouTube's own player plays it, with the Reel Fishy bar, transcript and chapters beside it. When off, those tags show a notice with a link to the video on YouTube."
PLG_SYSTEM_REELFISHY_ALLOW_VIMEO_LABEL="Allow Vimeo videos"
PLG_SYSTEM_REELFISHY_ALLOW_VIMEO_DESC="Lets a tag's src be a Vimeo link, played in Vimeo's own player. When off, those tags show a notice with a link to the video on Vimeo."
PLG_SYSTEM_REELFISHY_ALLOW_TIKTOK_LABEL="Allow TikTok videos"
PLG_SYSTEM_REELFISHY_ALLOW_TIKTOK_DESC="Lets a tag's src be a TikTok video link, played in TikTok's own player. TikTok's player has no speed control. When off, those tags show a notice with a link to the video on TikTok."
PLG_SYSTEM_REELFISHY_PRIVACY_LABEL="Privacy screen"
PLG_SYSTEM_REELFISHY_PRIVACY_DESC="Nothing loads from YouTube, Vimeo or TikTok until the visitor presses play. A short notice says where the video comes from. Videos always use youtube-nocookie.com and Vimeo's do-not-track mode either way."
PLG_SYSTEM_REELFISHY_PRIVACY_REMEMBER_LABEL="Offer “always load”"
PLG_SYSTEM_REELFISHY_PRIVACY_REMEMBER_DESC="Adds an “Always load YouTube videos on this site” checkbox. The choice is saved in the visitor's browser, separately for each service."
PLG_SYSTEM_REELFISHY_PRIVACY_THUMBS_LABEL="YouTube thumbnail on the screen"
PLG_SYSTEM_REELFISHY_PRIVACY_THUMBS_DESC="Shows the video's YouTube thumbnail behind the privacy notice when the tag has no poster. The image comes from YouTube's servers, so the visitor's browser contacts YouTube before they press play."
PLG_SYSTEM_REELFISHY_PRIVACY_TEXT_LABEL="Notice text"
PLG_SYSTEM_REELFISHY_PRIVACY_TEXT_DESC="Your own wording for the privacy notice. {service} becomes YouTube, Vimeo or TikTok. A link to that service's privacy policy is added after it. Empty uses the built-in text."
PLG_SYSTEM_REELFISHY_PRIVACY_TEXT_HINT="This video is on {service}. Pressing play loads it from {service}, which may set cookies and collect data."

PLG_SYSTEM_REELFISHY_FIELDSET_SEO="Search engines"
PLG_SYSTEM_REELFISHY_STRUCTURED_LABEL="Video structured data"
PLG_SYSTEM_REELFISHY_STRUCTURED_DESC="Tells search engines about each video in an article (Google's VideoObject), with the transcript text and chapters as key moments. Uses the article's title, meta description and publish date, and the poster as the thumbnail (for YouTube without a poster, the YouTube thumbnail)."

PLG_SYSTEM_REELFISHY_FIELDSET_EDITOR="Editor button"
PLG_SYSTEM_REELFISHY_BROWSE_ROOTS_LABEL="Browse folders"
PLG_SYSTEM_REELFISHY_BROWSE_ROOTS_DESC="Top-level site folders the editor button's Browse picker can open, separated by commas. Only signed-in users who can write content can browse."

PLG_SYSTEM_REELFISHY_FIELDSET_COLORS="Colors"
PLG_SYSTEM_REELFISHY_ACCENT_1_LABEL="Accent 1 (progress end)"
PLG_SYSTEM_REELFISHY_ACCENT_2_LABEL="Accent 2 (progress middle, knob ring)"
PLG_SYSTEM_REELFISHY_ACCENT_3_LABEL="Accent 3 (highlights, wrasse)"
PLG_SYSTEM_REELFISHY_ACCENT_4_LABEL="Accent 4 (focus, search matches)"
